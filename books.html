<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="books.css"> 
        <script src="library.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div id="buttonNew">
                <button id="addNewBook">New Book</button>
            </div>
            <div id="bookForm" class="hidden">
                <form>
                    <label for="title">Title
                        <input type="text" id="title" class="titleInput" name="title" required>
                    </label>

                    <label for="author">Author
                        <input type="text" id="author" class="authorInput" name="author" required>
                    </label>

                    <label for="pages">Number of pages
                        <input type="text" id="pages" class="pagesInput" name="pages" required>
                    </label>

                    <button type="submit">Add</button>

                </form>
            </div>
        </div>
    </body>
    <script>

    </script>
</html>
